// Candidate/flag coverage shares the standard runtime, lease gates and Allure/TestOps pipeline.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def sources = p.extensions.getByName('sourceSets')
    def original = p.tasks.named('test', org.gradle.api.tasks.testing.Test).get()
    def register = { String point, String mode ->
        String taskName = "explab2984${point}${mode.capitalize()}"
        p.tasks.register(taskName, org.gradle.api.tasks.testing.Test) { t ->
            group = 'tickets'
            description = "EXPLAB-2984: $point candidates and flags; $mode config load; REST split + KAP"
            dependsOn p.tasks.named('testClasses')
            testClassesDirs = sources.test.output.classesDirs
            classpath = sources.test.runtimeClasspath
            useJUnitPlatform()
            filter.setIncludePatterns("ru.sber.qa.splitter.EXPLAB_2984.Splitter${point}*FlowTest")
            filter.setFailOnNoMatchingTests(true)
            systemProperties.putAll(original.systemProperties)
            jvmArgs(original.jvmArgs)
            ['explab2984.stand.config.enabled', 'explab2984.stand.application-flags.enabled'].each { systemProperty it, 'true' }
            // Preserve scoped workload/ConfigMap and mutation permissions from the configured environment.
            def forward = { k, v ->
                String key = k.toString()
                if (['stand.', 'splitter.', 'explab2984.', 'explab2690.', 'explab2885.', 'exlab2891.', 'kubernetes.'].any { key.startsWith(it) })
                    systemProperty key, v.toString()
            }
            p.properties.each(forward)
            System.properties.each(forward)
            systemProperty 'splitter.config.load.mode', mode
            systemProperty 'splitter.local.splitting-point', point.toUpperCase(Locale.ROOT)
            systemProperty 'file.encoding', 'UTF-8'
            systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
            systemProperty 'allure.results.directory', p.file('build/allure-results').absolutePath
            maxParallelForks = 1
            forkEvery = 0
            reports.junitXml.outputLocation.set(p.layout.buildDirectory.dir('test-results/' + taskName))
            reports.html.outputLocation.set(p.layout.buildDirectory.dir('reports/tests/' + taskName))
            outputs.upToDateWhen { false }
        }
    }
    ['rest', 'kafka'].each { mode -> ['Reactions', 'Mapper'].each { point -> register(point, mode) } }
    def order = ['explab2984ReactionsRest', 'explab2984MapperRest', 'explab2984ReactionsKafka', 'explab2984MapperKafka']
    order.eachWithIndex { name, index -> p.tasks.named(name) { mustRunAfter order.take(index) } }
    p.tasks.register('explab2984Coverage') {
        group = 'tickets'
        description = 'EXPLAB-2984: REACTIONS + MAPPER with REST config load and correlated KAP'
        dependsOn 'explab2984ReactionsRest', 'explab2984MapperRest'
    }
    def checks = sources.create('explab2984Checks') {
        java.srcDir 'src/workloadChecks/java'
        java.include 'util/splittercheck/CandidateSelectionChecks.java', 'steps/rest/splitter/SplitterKafkaReportChecks.java'
        java.include 'config/services/splitter/WorkedGroupProfileChecks.java'
        compileClasspath = sources.main.output + p.configurations.testCompileClasspath
        runtimeClasspath = output + compileClasspath + p.configurations.testRuntimeClasspath
    }
    p.tasks.register('explab2984LocalChecks', org.gradle.api.tasks.testing.Test) {
        group = 'tickets'
        description = 'EXPLAB-2984: isolated oracle, profile and report-correlation checks; no stand access'
        testClassesDirs = checks.output.classesDirs
        classpath = checks.runtimeClasspath
        useJUnitPlatform()
        systemProperty 'allure.results.directory', p.file('build/local-checks/explab2984/allure-results').absolutePath
        reports.junitXml.outputLocation.set(p.layout.buildDirectory.dir('local-checks/explab2984/junit'))
        reports.html.outputLocation.set(p.layout.buildDirectory.dir('local-checks/explab2984/report'))
    }
}
