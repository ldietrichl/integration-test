    schedulerInfrastructureDiagnostics: 'Scheduler: диагностика инфраструктуры в согласованное окно',
    splitterRestDebug: 'Splitter: диагностика загрузки конфигурации через REST',
    splitterKafkaDebug: 'Splitter: диагностика загрузки конфигурации через Kafka',
    ignitePreflight: 'Ignite: проверка соединения без изменения данных'
]
def regressions = extensions.extraProperties.get('serviceRegressionDescriptions') + [
    splitterExtensionRegression: 'Splitter: расширенная регрессия, отдельно от заявки 2690'
]
def tickets = [
    explab2690MapperCoverage: 'EXPLAB-2690: MAPPER-покрытие с управляемым состоянием стенда',
    explab2690ReactionsCoverage: 'EXPLAB-2690: REACTIONS, общий жизненный цикл стенда',
