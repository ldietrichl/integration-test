import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

// An isolated Gradle project: synthetic results only, no stand, no upload, no Java dependencies.
tasks.register('verify') {
    doLast {
        def build = layout.buildDirectory.get().asFile
        def raw = new File(build, 'allure-results')
        def nested = new File(raw, 'explab2690Coverage')
        def junit = new File(build, 'test-results/explab2690Coverage')
        def output = new File(build, 'testops-results/dev')
        def json = { f, v -> f.parentFile.mkdirs(); f.setText(JsonOutput.toJson(v), 'UTF-8') }
        def read = { f -> new JsonSlurper().parse(f, 'UTF-8') }
        def digest = { f -> MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
        def snapshot = { dir ->
            def result = [:]
            if (dir.exists()) dir.eachFileRecurse { f -> if (f.isFile()) result[dir.toPath().relativize(f.toPath()).toString()] = digest(f) }
            result
        }
        def result = { uid, clazz -> [uuid:uid, name:uid, fullName:clazz+'.test', historyId:uid,
            status:'passed', stage:'finished', start:1767225600100L, stop:1767225600900L,
            labels:[[name:'testEnvironment',value:'dev'],[name:'testClass',value:clazz]],
            parameters:[[name:'splitter.config.load.mode',value:'rest']],
            attachments:[[name:'pod log',source:uid+'-attachment.txt',type:'text/plain']]] }
        def writeResult = { dir, uid, clazz ->
            json(new File(dir,uid+'-result.json'), result(uid,clazz))
            new File(dir,uid+'-attachment.txt').text = 'service log '+uid
            json(new File(dir,uid+'-container.json'),[uuid:uid+'-fixture',children:[uid]])
        }
        def seed = {
            // These paths are fixed children of this isolated project's build directory.
            [raw, new File(build,'test-results')].each { target ->
                assert target.canonicalFile.toPath().startsWith(projectDir.canonicalFile.toPath())
                project.delete(target)
            }
            writeResult(raw,'root','RootTest')
            writeResult(nested,'ticket','TicketTest')
            junit.mkdirs()
            new File(junit,'TEST-TicketTest.xml').text = '''<testsuite name="TicketTest" tests="1" failures="0" errors="0" skipped="0" timestamp="2026-01-01T00:00:00" time="1"><testcase classname="TicketTest" name="test" time="1"/></testsuite>'''
        }
        def actions = project.ext.platformBuildContext.selectedArtifactActions.invoke('dev',raw,false)
        def checks = 0
        def success = { label, count ->
            def before=snapshot(raw)
            actions.first.invoke()
            assert snapshot(raw)==before : 'Preparation changed original results'
            assert read(new File(output,'manifest.json')).resultCount==count
            assert new File(output,'allure-results').listFiles().every { it.isFile() }
            checks++; logger.lifecycle('PASS: '+label)
        }
        def reject = { label, needle, change ->
            seed(); change()
            def before=snapshot(output); def original=snapshot(raw)
            String message=null
            try { actions.first.invoke() } catch(Exception e) {
                def messages=[]; for (Throwable t=e; t!=null; t=t.cause) messages.add(t.message)
                message=messages.join('\n')
            }
            assert message != null && message.contains(needle) : label+': '+message
            assert snapshot(output)==before : 'Previous prepared package changed'
            assert snapshot(raw)==original : 'Rejected input changed'
            checks++; logger.lifecycle('PASS: '+label)
        }
        seed(); success('flat root + task scope',2)
        seed(); project.delete(nested); success('flat source compatibility',1)
        seed(); raw.listFiles().findAll { it.isFile() }.each { it.delete() }; success('task-only source',1)
        seed(); [raw,nested].each { new File(it,'environment.properties').text='env=dev\n' }; success('identical metadata',2)
        reject('conflicting attachment','filename collision') { new File(raw,'ticket-attachment.txt').text='different' }
        reject('missing scoped attachment cannot borrow root file','source scope') {
            new File(raw,'ticket-attachment.txt').bytes=new File(nested,'ticket-attachment.txt').bytes
            new File(nested,'ticket-attachment.txt').delete()
        }
        reject('duplicate result file','filename collision') {
            new File(raw,'ticket-result.json').bytes=new File(nested,'ticket-result.json').bytes
            new File(raw,'ticket-attachment.txt').bytes=new File(nested,'ticket-attachment.txt').bytes
        }
        reject('duplicate UUID under another filename','duplicate Allure UUID') {
            def j=read(new File(raw,'root-result.json')); j.uuid='ticket'; json(new File(raw,'root-result.json'),j)
            json(new File(raw,'root-container.json'),[uuid:'root-fixture',children:['ticket']])
        }
        reject('container cannot borrow child from another scope','source scope') {
            json(new File(nested,'ticket-container.json'),[uuid:'ticket-fixture',children:['root']])
        }
        reject('conflicting environment metadata','filename collision') {
            new File(raw,'environment.properties').text='env=dev\n'
            new File(nested,'environment.properties').text='env=ift\n'
        }
        reject('unknown source directory','Unsupported Allure source directory') { new File(raw,'local-checks').mkdirs() }
        reject('nested source directory','Expected flat Allure results') { new File(nested,'nested').mkdirs() }
        reject('wrong environment','environment mismatch') {
            def f=new File(nested,'ticket-result.json');def j=read(f);j.labels[0].value='ift';json(f,j)
        }
        reject('wrong mode','Unexpected config-load mode') {
            def f=new File(nested,'ticket-result.json');def j=read(f);j.parameters[0].value='kafka';json(f,j)
        }
        reject('missing JUnit','Missing JUnit evidence') { project.delete(junit) }
        reject('unfinished executor','Incomplete JUnit execution') {
            def f=new File(junit,'TEST-TicketTest.xml');f.text=f.text.replace('name="TicketTest"','name="Gradle Test Executor 1"')
        }
        reject('different JUnit status','JUnit/Allure mismatch') {
            def f=new File(nested,'ticket-result.json');def j=read(f);j.status='failed';json(f,j)
        }
        reject('stale result','outside latest JUnit execution') {
            def f=new File(nested,'ticket-result.json');def j=read(f);j.start-=10000;j.stop-=10000;json(f,j)
        }
        reject('unfinished result','Unfinished Allure artifact') {
            def f=new File(nested,'ticket-result.json');def j=read(f);j.stage='running';json(f,j)
        }
        reject('registration results excluded','Registration result rejected') {
            def f=new File(nested,'ticket-result.json');def j=read(f);j.historyId='registration-only::ticket';json(f,j)
        }
        seed()
        new File(raw,'notes.txt').text='keep root notes'
        new File(nested,'notes.txt').text='keep task notes'
        actions.second.invoke()
        assert raw.listFiles().findAll { it.isFile() }*.name==['notes.txt']
        assert nested.listFiles()*.name==['notes.txt']
        assert !output.exists()
        assert new File(junit,'TEST-TicketTest.xml').exists()
        checks++; logger.lifecycle('PASS: cleanup preserves unrecognized files and JUnit')
        seed();new File(raw,'unknown').mkdirs()
        def original=snapshot(raw)
        try { actions.second.invoke(); assert false } catch(GradleException expected) { assert snapshot(raw)==original }
        checks++; logger.lifecycle('PASS: cleanup refuses unknown directory before deletion')
        logger.lifecycle("Allure source layout: $checks checks passed; no stand access or upload")
    }
}

// Routing and migration checks execute the real production Gradle actions against synthetic evidence.
tasks.named('verify') {
    doLast {
        def root = layout.buildDirectory.get().asFile
        def raw = new File(root,'allure-results')
        def regressionRaw = new File(root,'allure-results-splitter-rest-kafka')
        def json = { f, v -> f.parentFile.mkdirs(); f.setText(JsonOutput.toJson(v),'UTF-8') }
        def read = { f -> new JsonSlurper().parse(f,'UTF-8') }
        def actions = { name -> def t=tasks.named(name).get(); t.actions.each { it.execute(t) } }
        def ticketNames=['explab2690MapperCoverage','explab2690ReactionsCoverage','explab2690Coverage',
                         'explab2972Test','explab2972ManagedTest','explab2972LaunchPlanTest']
        ticketNames.each { name ->
            assert new File(tasks.named(name).get().systemProperties['allure.results.directory'].toString()).canonicalFile==raw.canonicalFile
        }
        assert tasks.named('splitterExtensionRegression').get().systemProperties['allure.results.directory'].endsWith('allure-results-splitter-extension')
        assert !tasks.named('bypassTests').get().systemProperties['allure.results.directory'].endsWith('build/allure-results')
        logger.lifecycle('PASS: all ticket task routes are flat; extension regression and bypass are separate')
        // Remove only this fixture's known generated directories; production evidence is never touched.
        [raw,regressionRaw,new File(root,'splitter-allure-mirror')].each { dir ->
            assert dir.canonicalFile.toPath().startsWith(projectDir.canonicalFile.toPath())
            project.delete(dir)
        }
        def clazz='ru.sber.qa.splitter.EXPLAB_2690.TicketTest'
        def seed = { dir, uid, mode ->
            json(new File(dir,uid+'-result.json'),[uuid:uid,fullName:clazz+'.test',name:uid,historyId:uid,
                status:'passed',stage:'finished',start:1767225600100L,stop:1767225600900L,
                labels:[[name:'testEnvironment',value:'dev'],[name:'testClass',value:clazz]],
                parameters:[[name:'splitter.config.load.mode',value:mode]],
                attachments:[[name:'pod log',source:uid+'-attachment.txt',type:'text/plain']]])
            new File(dir,uid+'-attachment.txt').text='bounded service log'
            json(new File(dir,uid+'-container.json'),[uuid:uid+'-fixture',children:[uid]])
        }
        def xml = { dir ->
            dir.mkdirs()
            new File(dir,'TEST-TicketTest.xml').text='<testsuite name="'+clazz+'" tests="1" failures="0" errors="0" skipped="0" timestamp="2026-01-01T00:00:00" time="1"><testcase classname="'+clazz+'" name="test" time="1"/></testsuite>'
        }
        seed(raw,'ticket-current','rest')
        def xmlRoot=new File(root,'test-results/explab2690Coverage'); project.delete(xmlRoot); xml(xmlRoot)
        project.ext.testOpsCompletedStages='2690-core'
        actions('prepareCompletedTestOpsResults')
        def prepared=new File(root,'completed-testops/dev/manifest.json')
        assert read(prepared).total==1
        logger.lifecycle('PASS: completed 2690 selection reads common directory')
        def legacy=new File(raw,'explab2690Coverage'); legacy.mkdirs()
        raw.listFiles().findAll { it.isFile() }.each { java.nio.file.Files.move(it.toPath(),new File(legacy,it.name).toPath()) }
        actions('prepareCompletedTestOpsResults'); assert read(prepared).total==1
        logger.lifecycle('PASS: completed 2690 selection accepts legacy folder')
        def previous=prepared.text
        seed(raw,'ticket-current','rest')
        try { actions('prepareCompletedTestOpsResults'); assert false }
        catch(GradleException expected) { assert expected.message.contains('Duplicate Allure filename') }
        assert prepared.text==previous
        logger.lifecycle('PASS: ambiguous current/legacy sources rejected; previous bundle preserved')
        project.delete(legacy)
        ['splitter-rest':'rest','splitter-kafka':'kafka'].each { stage,mode ->
            def stageRoot=new File(root,'regression-results/dev/'+stage)
            def run=new File(stageRoot,'runs/layout-check'); seed(new File(run,'allure-results'),stage,mode)
            xml(new File(run,'test-results'))
            new File(stageRoot,'latest.txt').text='runs/layout-check'
            json(new File(run,'summary.json'),[completed:true,environment:'dev',stage:stage,total:1,passed:1,failed:0,skipped:0])
            actions(mode=='rest'?'splitterRestRegressionAllureResults':'splitterKafkaRegressionAllureResults')
        }
        assert raw.listFiles().findAll { it.name.endsWith('-result.json') }*.name==['ticket-current-result.json']
        assert regressionRaw.listFiles().count { it.name.endsWith('-result.json') }==2
        logger.lifecycle('PASS: regression collectors preserve ticket root and combine REST/Kafka separately')
        def pending=new File(root,'splitter-allure-mirror/splitter-rest.pending')
        json(pending,[destination:regressionRaw.canonicalPath,status:'running'])
        actions('prepareTestOpsResults'); actions('cleanTestOpsResults'); assert pending.isFile()
        logger.lifecycle('PASS: regression pending does not block or disappear during ticket preparation/cleanup')
        json(pending,[destination:raw.canonicalPath,status:'running'])
        try { actions('prepareTestOpsResults'); assert false }
        catch(GradleException expected) { assert expected.message.contains('incomplete') }
        pending.text='legacy incomplete marker'
        try { actions('prepareTestOpsResults'); assert false }
        catch(GradleException expected) { assert expected.message.contains('incomplete') }
        logger.lifecycle('PASS: same-scope and legacy pending still block upload preparation')
        project.delete(pending)
        logger.lifecycle('Routing/migration: 7 checks passed; no stand access or upload')
    }
}
