import groovy.json.JsonOutput
import groovy.util.XmlSlurper
import java.nio.charset.StandardCharsets
import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile
import javax.tools.ToolProvider
import org.gradle.api.GradleException
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.Usage
import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.testing.Test

// Invoke with the existing wrapper and -I; the project's repositories/credentials are reused.
// No dependencies are added to main/test classpaths. No stand connection is made by this task.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    // A caller may accidentally repeat -I. Register actions/configuration/tasks once.
    def marker = 'corporateIgniteClientInitApplied'
    if (project.extensions.extraProperties.has(marker)) return
    project.extensions.extraProperties.set(marker, true)

    // Forward explicit command-line settings even if the key is absent from secure files.
    // Use -P before -D. Restore Java-side source precedence for connection profiles.
    // Java readers retain responsibility for secure-file/env-var resolution and profile isolation.
    def isClientProperty = { String name ->
        name == 'env' || name.startsWith('ignite.') ||
                name.startsWith('data-operator.fixture.') || name.startsWith('links.fixture.')
    }
    def commandLineProperties = gradle.startParameter.projectProperties
    def propertyNames = new LinkedHashSet<String>()
    propertyNames.addAll(System.getProperties().stringPropertyNames())
    propertyNames.addAll(commandLineProperties.keySet())
    def forwardedProperties = [:]
    propertyNames.findAll(isClientProperty).each { String name ->
        def value = commandLineProperties.containsKey(name) ?
                commandLineProperties[name] : System.getProperty(name)
        if (value != null) forwardedProperties[name] = value.toString()
    }
    def forwardClientProperties = { task ->
        task.doFirst {
            // Some corporate builds promote every secure-file value to a Test system property.
            // Remove those implicit profile values so a scoped environment variable can override
            // the secure file (including an explicit blank). Java will read the files itself.
            // Preserve the build's env selector and unscoped legacy controls such as links.fixture.manifest.
            def effectiveProperties = new LinkedHashMap(task.systemProperties)
            effectiveProperties.keySet().removeAll { name ->
                name.toString() ==~ /(?:ignite|data-operator\.fixture|links\.fixture)\.(?:dev|ift|ift-dm|lt|local)\..+/
            }
            forwardedProperties.each { String name, String value ->
                effectiveProperties[name] = value
            }
            task.setSystemProperties(effectiveProperties)
        }
    }
    project.tasks.withType(Test).configureEach(forwardClientProperties)
    project.tasks.withType(JavaExec).configureEach(forwardClientProperties)

    def sourceRoot = project.file('tools/ignite-client')
    def descriptor = new File(sourceRoot, 'pom-corporate.xml')
    if (!descriptor.isFile()) {
        throw new GradleException("Corporate client descriptor missing: ${descriptor}")
    }
    def pom = new XmlSlurper(false, false).parse(descriptor)
    def properties = [:]
    pom.properties.children().each { properties[it.name()] = it.text().trim() }
    def expand = { String value ->
        value.replaceAll(/\$\{([^}]+)\}/) { match, key ->
            if (!properties.containsKey(key)) {
                throw new GradleException("Unknown corporate dependency property: ${key}")
            }
            properties[key]
        }
    }
    def moduleOf = { node ->
        [group: node.groupId.text().trim(), artifact: node.artifactId.text().trim(),
         version: expand(node.version.text().trim())]
    }
    def requested = pom.dependencies.dependency.collect(moduleOf)
    def platforms = pom.dependencyManagement.dependencies.dependency.collect { node ->
        if (node.type.text() != 'pom' || node.scope.text() != 'import') {
            throw new GradleException('Corporate dependency management must contain imported BOMs only')
        }
        moduleOf(node)
    }
    def configuration = project.configurations.create('corporateIgniteClientLibraries') {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, project.objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, project.objects.named(Category, Category.LIBRARY))
        }
        resolutionStrategy {
            failOnDynamicVersions()
            failOnChangingVersions()
        }
    }
    platforms.each { module ->
        configuration.dependencies.add(project.dependencies.enforcedPlatform(
                "${module.group}:${module.artifact}:${module.version}"))
    }
    requested.each { module ->
        def coordinate = "${module.group}:${module.artifact}" + (module.version ? ":${module.version}" : '')
        def dependency = project.dependencies.create(coordinate)
        if (module.version) {
            dependency.version { constraint -> constraint.strictly(module.version) }
        }
        configuration.dependencies.add(dependency)
    }

    project.tasks.register('prepareCorporateIgniteClient') {
        group = 'Ignite'
        description = 'Resolve corporate Ignite dependencies and prepare an isolated, versioned client bundle for project tests.'
        doLast {
            def compiler = ToolProvider.systemJavaCompiler
            if (compiler == null || Runtime.version().feature() < 17) {
                throw new GradleException('Run Gradle with JDK 17 or later; the helper is compiled with --release 17.')
            }
            def helperNames = ['IgniteClientSupport.java', 'IgniteConnectionProbe.java']
            helperNames.each { name ->
                if (!new File(sourceRoot, name).isFile()) {
                    throw new GradleException("Install the complete Ignite client overlay: ${name} missing")
                }
            }
            def hashFile = { File file ->
                def digest = MessageDigest.getInstance('SHA-256')
                file.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                digest.digest().encodeHex().toString()
            }

            // Resolution uses only repositories already configured by the test project.
            def artifacts = configuration.resolvedConfiguration.resolvedArtifacts.toList().sort { a, b ->
                "${a.moduleVersion.id}:${a.name}:${a.classifier ?: ''}" <=> "${b.moduleVersion.id}:${b.name}:${b.classifier ?: ''}"
            }
            if (artifacts.isEmpty()) throw new GradleException('No corporate client libraries resolved')
            def libraries = artifacts.collect { artifact ->
                def id = artifact.moduleVersion.id
                if (artifact.extension != 'jar') {
                    throw new GradleException("Unexpected corporate client artifact: ${id}")
                }
                def name = "${id.group}.${artifact.name}-${id.version}" +
                        (artifact.classifier ? "-${artifact.classifier}" : '') + '.jar'
                if (!(name ==~ /[A-Za-z0-9._-]+\.jar/)) {
                    throw new GradleException("Unsupported library filename: ${name}")
                }
                [file: name.toString(), group: id.group, artifact: id.name, version: id.version,
                 sha256: hashFile(artifact.file), resolvedFile: artifact.file]
            }
            if (libraries*.file.toSet().size() != libraries.size()) {
                throw new GradleException('Duplicate corporate library filename')
            }
            requested.each { module ->
                def selected = libraries.findAll { it.group == module.group && it.artifact == module.artifact }
                if (selected.size() != 1 || (module.version && selected[0].version != module.version)) {
                    throw new GradleException("Direct dependency differs from descriptor: ${module.group}:${module.artifact}:${module.version}")
                }
            }
            // Follow the descriptor's direct dependency order before transitive dependencies.
            // The corporate distribution repeats BinaryObject in core and binary-api; keep core first.
            def dependencyPriority = { library ->
                def index = requested.findIndexOf { it.group == library.group && it.artifact == library.artifact }
                index >= 0 ? index : requested.size()
            }
            libraries.sort { a, b ->
                (dependencyPriority(a) <=> dependencyPriority(b)) ?: (a.file <=> b.file)
            }
            def classChecks = []
            def providerProblems = []
            ['org/apache/ignite/Ignition.class', 'org/apache/ignite/configuration/ClientConfiguration.class',
             'org/apache/ignite/binary/BinaryObject.class'].each { className ->
                def owners = []
                libraries.each { library ->
                    new ZipFile(library.resolvedFile).withCloseable { zip ->
                        def entry = zip.getEntry(className)
                        if (entry != null) {
                            def classHash = zip.getInputStream(entry).withCloseable { input ->
                                MessageDigest.getInstance('SHA-256').digest(input.readAllBytes()).encodeHex().toString()
                            }
                            owners.add([file: library.file, group: library.group, artifact: library.artifact,
                                        version: library.version, classSha256: classHash])
                        }
                    }
                }
                boolean identical = owners.size() > 1 && owners*.classSha256.toSet().size() == 1
                boolean corporateBinaryOverlap = className == 'org/apache/ignite/binary/BinaryObject.class' &&
                        owners.size() == 2 && owners.every {
                            it.group == 'com.sbt.ignite' && it.version == properties['ignite.se.version'] &&
                                    it.file == "com.sbt.ignite.${it.artifact}-${it.version}.jar"
                        } && owners*.artifact.toSet() == ['ignite-core', 'ignite-binary-api'].toSet() &&
                        owners[0].artifact == 'ignite-core'
                def policy = owners.size() == 1 ? 'single-provider' : identical ? 'identical-class-bytes' :
                        corporateBinaryOverlap ? 'corporate-core-before-binary-api' : 'rejected'
                classChecks.add([className: className, selectedFile: owners ? owners[0].file : null,
                                 policy: policy, byteIdentical: identical, providers: owners])
                if (policy == 'rejected') {
                    providerProblems.add("Missing or conflicting providers of ${className}: ${owners*.file}")
                } else if (owners.size() > 1) {
                    logger.lifecycle("Class overlap: ${className}; selected ${owners[0].file}; policy=${policy}")
                }
            }
            // Preserve evidence even if another provider check fails before the bundle can be published.
            def diagnosticDir = project.layout.buildDirectory.dir('ignite-client-compile').get().asFile.toPath()
            Files.createDirectories(diagnosticDir)
            def diagnosticFile = diagnosticDir.resolve('dependency-diagnostics.json')
            Files.writeString(diagnosticFile, JsonOutput.prettyPrint(JsonOutput.toJson([
                    classpathPolicy: 'direct-dependencies-first-v1',
                    libraries: libraries.collect { library -> library.findAll { key, value -> key != 'resolvedFile' } },
                    requiredClasses: classChecks, errors: providerProblems])) + '\n', StandardCharsets.UTF_8)
            if (!providerProblems.isEmpty()) {
                throw new GradleException("${providerProblems.join('; ')}. See ${diagnosticFile}")
            }
            def lock = [schemaVersion: 1, runtime: "Corporate Ignite ${properties['ignite.se.version']}",
                        helperSources: helperNames,
                        classpathPolicy: 'direct-dependencies-first-v1', requiredClasses: classChecks,
                        libraries: libraries.collect { library -> library.findAll { key, value -> key != 'resolvedFile' } }]
            byte[] lockBytes = (JsonOutput.prettyPrint(JsonOutput.toJson(lock)) + '\n').getBytes(StandardCharsets.UTF_8)
            def digest = MessageDigest.getInstance('SHA-256')
            digest.update(lockBytes)
            helperNames.each { digest.update(Files.readAllBytes(new File(sourceRoot, it).toPath())) }
            def runtimeHash = digest.digest().encodeHex().toString()

            // Immutable per-runtime directories preserve clients needed to recover old fixture manifests.
            def outputRoot = new File(sourceRoot, 'corporate-runtimes').canonicalFile.toPath()
            Files.createDirectories(outputRoot)
            def destination = outputRoot.resolve(runtimeHash).normalize()
            if (!destination.startsWith(outputRoot) || destination == outputRoot) {
                throw new GradleException('Corporate bundle path escaped the runtime directory')
            }
            boolean reuse = Files.exists(destination)
            def staging = reuse ? destination : Files.createTempDirectory(outputRoot, '.preparing-')
            if (!reuse) {
                Files.createDirectory(staging.resolve('lib'))
                libraries.each { library ->
                    Files.copy(library.resolvedFile.toPath(), staging.resolve('lib').resolve(library.file))
                }
                helperNames.each { Files.copy(new File(sourceRoot, it).toPath(), staging.resolve(it)) }
                Files.write(staging.resolve('client-libraries.lock.json'), lockBytes)
                Files.copy(descriptor.toPath(), staging.resolve('pom-corporate.xml'))
                def graph = [dependencyDescriptorSha256: hashFile(descriptor),
                             platforms: platforms, requested: requested, runtimeSha256: runtimeHash,
                             classpathPolicy: lock.classpathPolicy, requiredClasses: classChecks,
                             libraries: lock.libraries]
                Files.writeString(staging.resolve('dependency-resolution.json'),
                        JsonOutput.prettyPrint(JsonOutput.toJson(graph)) + '\n', StandardCharsets.UTF_8)
            }
            libraries.each { library ->
                if (hashFile(staging.resolve('lib').resolve(library.file).toFile()) != library.sha256) {
                    throw new GradleException("Library changed during copy: ${library.file}")
                }
            }
            // Validate copied sources too, including concurrent edits and existing bundle tampering.
            def actualDigest = MessageDigest.getInstance('SHA-256')
            (['client-libraries.lock.json'] + helperNames).each {
                actualDigest.update(Files.readAllBytes(staging.resolve(it)))
            }
            if (actualDigest.digest().encodeHex().toString() != runtimeHash) {
                throw new GradleException("Corporate bundle content changed: ${staging}")
            }
            def compileDir = project.layout.buildDirectory.dir("ignite-client-compile/${runtimeHash}").get().asFile
            Files.createDirectories(compileDir.toPath())
            def compileLog = new File(compileDir, 'compile.log')
            def classpath = libraries.collect { staging.resolve('lib').resolve(it.file).toString() }.join(File.pathSeparator)
            def arguments = ['--release', '17', '-encoding', 'UTF-8', '-proc:none', '-cp', classpath,
                             '-d', compileDir.absolutePath] + helperNames.collect { staging.resolve(it).toString() }
            int compileStatus = compileLog.withOutputStream { output ->
                compiler.run(null, output, output, arguments as String[])
            }
            if (compileStatus != 0) {
                throw new GradleException("Corporate helper compilation failed. See ${compileLog}. Staging retained: ${staging}")
            }
            if (!reuse) {
                try {
                    Files.move(staging, destination, StandardCopyOption.ATOMIC_MOVE)
                } catch (AtomicMoveNotSupportedException ignored) {
                    Files.move(staging, destination)
                }
            }
            def relative = project.projectDir.toPath().toAbsolutePath().normalize().relativize(destination).toString().replace('\\', '/')
            // Publish the selector only after all downloads, validation and compilation have succeeded.
            def selectorTemporary = Files.createTempFile(outputRoot, '.selector-', '.txt')
            Files.writeString(selectorTemporary, relative + '\n', StandardCharsets.UTF_8)
            try {
                Files.move(selectorTemporary, outputRoot.resolve('latest-runtime.txt'),
                        StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } catch (AtomicMoveNotSupportedException ignored) {
                Files.move(selectorTemporary, outputRoot.resolve('latest-runtime.txt'), StandardCopyOption.REPLACE_EXISTING)
            }
            logger.lifecycle("Corporate client prepared: ${relative}")
            logger.lifecycle("Resolved libraries: ${libraries.size()}; helper compilation passed; no stand connection made.")
            logger.lifecycle("Set ignite.<env>.runtime.directory=${relative} for the selected test environment.")
            logger.lifecycle('Existing secrets, fixture manifests and prior client bundles were preserved.')
        }
    }
}
