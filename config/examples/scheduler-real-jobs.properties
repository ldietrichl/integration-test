# Example only. Merge selected keys into existing test.properties; never replace that file.
# Keep current corporate connection, TLS, database and secret settings unchanged.
# Pause ownership is always the JUnit root; no Gradle-only flag is required.

# The application token stays in the local launching process, not in project files.
stand.dev.application.access-token.env=EXPLAB_DEV_ACCESS_TOKEN
stand.dev.kubernetes.user.service=user-service
stand.dev.kubernetes.user.service-port=8080
# Explicit permission is required; preserve an already approved value in test.properties.
stand.dev.workloads.scheduler.regression.jobs.enabled=false
stand.dev.workloads.scheduler.regression.timeout.seconds=240
# Fill with confirmed EFFECTIVE application values, not guessed defaults:
# stand.dev.workloads.scheduler.regression.execution-timeout.millis=<CONFIRMED_MILLISECONDS>
# stand.dev.workloads.scheduler.regression.overdue.minutes=<CONFIRMED_MINUTES>

stand.ift.application.access-token.env=EXPLAB_IFT_ACCESS_TOKEN
stand.ift.kubernetes.user.service=user-service
stand.ift.kubernetes.user.service-port=8080
stand.ift.workloads.scheduler.regression.jobs.enabled=false
stand.ift.workloads.scheduler.regression.timeout.seconds=240
# Set IFT's own confirmed thresholds before enabling its cleanup scenarios.

