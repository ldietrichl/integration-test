# Справочник секретных переменных проекта.
# Этот файл можно хранить в Git: здесь только имена переменных, назначение и безопасные заглушки.
# Файл подключается через Owner-конфиг SecureLocalConfig вместе с system properties и env.
# Реальные значения могут быть открытыми, зашифрованными в формате ENC(...), либо ссылками vault.*.
# Реальные значения для своей машины указывайте в secure.local.override.properties,
# переменных окружения или JVM/Gradle -D/-P параметрах.

# Учетная запись или имя токена Nexus для скачивания зависимостей Gradle.
# Используется в build.gradle.kts при подключении nexusPublicRepository/nexusInternalRepository.
tokenName=<SET_ME_TOKEN_NAME>

# Пароль или token value Nexus для скачивания зависимостей Gradle.
# Используется вместе с tokenName в build.gradle.kts.
tokenPassword=<SET_ME_TOKEN_PASSWORD>

# Токен Allure TestOps для загрузки allure-results через allurectl.
# Нужен только если запускается upload в TestOps.
allureToken=<SET_ME_ALLURE_TOKEN>

# Токен контейнерного сервиса MCOD для операций с pod/container API.
# Источник: src/test/resources/container-service.properties -> mcod.token.
SECURE_MCOD_TOKEN=<SET_ME_SECURE_MCOD_TOKEN>

# Токен контейнерного сервиса SCOD для операций с pod/container API.
# Источник: src/test/resources/container-service.properties -> scod.token.
SECURE_SCOD_TOKEN=<SET_ME_SECURE_SCOD_TOKEN>

# Логин БД ExpLab для DEV-стенда.
# Источник: src/test/resources/database.properties -> db.dev.explab.login.
SECURE_DB_DEV_EXPLAB_LOGIN=<SET_ME_SECURE_DB_DEV_EXPLAB_LOGIN>

