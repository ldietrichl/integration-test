# Актуальная MAPPER ConfigMap, под которую выровнены REST tests-v9.
traffic-based-alternative: true
rules:
  final-exp-rule:
    rule-code: MAIN
    proc-code: mapperFinalExp
    proc-params:
      param-code: actionType
      value-type: INTEGER
      values-map:
        "0": 0
        "1": 10
        "2": 60
        "3": 40
        "4": 50
        "5": 20
        "6": 30
      alt-control:
        - 5
        - 6
  alternative-markup-rule:
    rule-code: ALTMARKUP
    proc-code: mapperAlternative
    proc-params:
      param-code: actionType
      value-type: INTEGER
      alt-markup-values:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      alt-rollback-values:
        - 5
        - 6
  filter-rule:
    rule-code: FILT
    proc-code: mapperFilter
    enabled: true
    proc-params:
      param-code: actionType
      value-type: INTEGER
      values:
        - 2
        - 4
  filtered-flag-rule:
    rule-code: FILTERED_FLAG
    proc-code: filteredFlag
    enabled: true
    proc-params:
      flag-code: filtered
