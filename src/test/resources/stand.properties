# Shared workload settings. Fill only the selected environment before a stand run.
# Keep kubeconfig and credentials in ignored secure.local.override.properties.
# Existing REST/Kafka connection profiles remain in their usual resource files.

stand.dev.kubernetes.enabled=false
stand.dev.kubernetes.container-service.ready=false
stand.dev.kubernetes.transport=fabric8
stand.dev.kubernetes.context=<SET_ME_CONTEXT>
stand.dev.kubernetes.api-server=https://<SET_ME_API_HOST>:6443
stand.dev.kubernetes.namespace=<SET_ME_NAMESPACE>
stand.dev.kubernetes.kubeconfig=${SECURE_KUBECONFIG}
stand.dev.kubernetes.logs.enabled=true
stand.dev.mutations.enabled=false
stand.dev.mutations.configmap.enabled=false
stand.dev.mutations.restart.enabled=false
stand.dev.mutations.pod-delete.enabled=false
stand.dev.mutations.namespace-confirmation=<SET_ME_NAMESPACE>
stand.dev.workloads.splitter-mapper.deployment=splitter-mapper-service
stand.dev.workloads.splitter-mapper.configmap=splitter-mapper-service-lib
stand.dev.workloads.splitter-mapper.service-configmap=splitter-mapper-service
stand.dev.workloads.splitter-mapper.readiness.timeout.seconds=120
stand.dev.workloads.splitter-mapper.readiness.poll.millis=2000
stand.dev.workloads.splitter-reactions.deployment=splitter-reactions-service
stand.dev.workloads.splitter-reactions.configmap=splitter-reactions-service-lib
stand.dev.workloads.splitter-reactions.service-configmap=splitter-reactions-service
stand.dev.workloads.splitter-reactions.readiness.timeout.seconds=120
stand.dev.workloads.splitter-reactions.readiness.poll.millis=2000

