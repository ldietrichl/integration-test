# Service-only behavior. Shared stand switches are in stand.properties.
# test.properties may override scheduler.<env>.<key>.
scheduler.schema.profile=dev-v2
scheduler.jobs.paused=false
# Socket read timeout for scheduler REST calls. Increased so bulk cleanup scenarios
# (e.g. mass delete of the 2000-row boundary) complete without SocketTimeoutException.
scheduler.timeout.seconds=120
scheduler.bulk.timeout.seconds=300
scheduler.splitting-point=MAPPER
scheduler.mtls.enabled=false
scheduler.ift.schema.profile=legacy-null
# Direct mode endpoint remains rest.<env>.scheduler.base-uri.
