# Настройки сессии для просмотра событий ППРБ журналов
# Хост сервиса
pprb.logger.url=
# Логин сервиса
pprb.logger.login=
# Пароль сервиса
pprb.logger.password=

# Группы параметров для набора сервисов Coordinator
# Группа параметров с именем 'onevalue'
# Топик Kafka (возможное значение: целое число более 0)
pprb.logger.coordinator.onevalue.kafka.topic=3014
# Максимальное количество записей в ответе (возможное значение: целое число более 0)
pprb.logger.coordinator.onevalue.max.rows.in.result=10
# Максимальное количество записей для поиска событий (возможное значение: целое число более 0)
pprb.logger.coordinator.onevalue.max.rows.to.scan=1000
# Сортировка записей в ответе (возможные значения: latest - по возрастанию, earliest - по убыванию)
pprb.logger.coordinator.onevalue.filter.offset.sort=latest

# Группа параметров с именем 'tenvalue'
# Топик Kafka
pprb.logger.coordinator.tenvalue.kafka.topic=1234
# Максимальное количество записей в ответе
pprb.logger.coordinator.tenvalue.max.rows.in.result=10
# Максимальное количество записей для поиска событий
pprb.logger.coordinator.tenvalue.max.rows.to.scan=1000
# Сортировка записей в ответе (latest - по возрастанию, earliest - по убыванию)
pprb.logger.coordinator.tenvalue.filter.offset.sort=latest