# Номер блока из sm.host.b{number} ниже, используемый для выбора одного из URL для блоков ЕФС например: sm.block=b1
sm.block=
# Логин сервиса
sm.login=
# Пароль сервиса
sm.password=

# URL для блоков ЕФС
sm.host.b1=
sm.host.b3=
sm.host.b5=
sm.host.b7=

# Группы параметров для набора сервисов Журналирования ЕФС
# Группа параметров с именем 'onevalue'
# Порядок сортировки (возможное значение: ASC, DESC)
dbp.logger.onevalue.order=ASC
# Текст со значением часового пояса (возможное значение: текст со значением часового пояса, например 'Europe/Moscow')
dbp.logger.onevalue.timezone=Europe/Moscow
# Параметр пагинации, номер записи с которой вернуть значения (возможное значение: целое число более 0)
dbp.logger.onevalue.paging.from=0
# Параметр пагинации, указывает на количество возвращаемых записей (возможное значение: целое число более 0)
dbp.logger.onevalue.paging.to=1
# Признак дедубликации (возможное значение: true/false)
dbp.logger.onevalue.disable.deduplicate=true
# Список уровней логирования, для которых выполняется поиск (возможное значение: не зааполнено, DEBUG, INFO, WARN, ERROR)
dbp.logger.onevalue.level=

# Группа параметров с именем 'tenvalue'
# Порядок сортировки (возможное значение: ASC, DESC)
dbp.logger.tenvalue.order=ASC
# Текст со значением часового пояса (возможное значение: текст со значением часового пояса)
dbp.logger.tenvalue.timezone=Europe/Moscow
# Параметр пагинации, номер записи с которой вернуть значения (возможное значение: целое число более 0)
dbp.logger.tenvalue.paging.from=0
# Параметр пагинации, указывает на количество возвращаемых записей (возможное значение: целое число более 0)
dbp.logger.tenvalue.paging.to=100
# Признак дедубликации (возможное значение: true/false)
dbp.logger.tenvalue.disable.deduplicate=false
# Список уровней логирования, для которых выполняется поиск (возможное значение: не зааполнено, DEBUG, INFO, WARN, ERROR)
dbp.logger.tenvalue.level=
