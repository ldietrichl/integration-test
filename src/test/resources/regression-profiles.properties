ift.splitter.config.kafka.env=splitter_ift
ift.splitter.kap.kafka.env=splitter_ift
ift.splitter.precalc.monitoring.kafka.env=splitter_ift
ift.splitter.config.load.monitoring.kafka.env=splitter_ift
ift.splitter.config.kafka.input.topic=splitting-config-created
ift.splitter.config.kafka.status.topic=splitting-config-requested-and-received
ift.splitter.config.kafka.monitoring.topic=explab_sowa_log
ift.splitter.kap.topic=explab-splitting-result
