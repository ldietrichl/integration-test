dev.splitter.config.kafka.env=splitter_dev
dev.splitter.kap.kafka.env=splitter_dev
dev.splitter.precalc.monitoring.kafka.env=splitter_dev
dev.splitter.config.load.monitoring.kafka.env=splitter_dev
dev.splitter.config.kafka.input.topic=splitting-config-created
dev.splitter.config.kafka.status.topic=splitting-config-requested-and-received
dev.splitter.config.kafka.monitoring.topic=omon_explab_splitter_log
