# Explicit isolated profile. env is still selected ONLY in test.properties.
# No token/password in this file. Existing kubeconfig is not modified.
# Only diagnostic switches live here. Connection identity is shared via stand.properties.
stand.dev.container-diagnostics.enabled=true
stand.dev.container-diagnostics.phase=before-browser
stand.dev.container-diagnostics.deployment=scheduler-service
stand.dev.container-diagnostics.service=scheduler-service
stand.dev.container-diagnostics.configmap=scheduler-service
stand.dev.container-diagnostics.container=scheduler-service
stand.dev.container-diagnostics.fabric8-control.enabled=true
stand.dev.container-diagnostics.logs.window.seconds=30
stand.dev.container-diagnostics.rollout.timeout.seconds=180
stand.dev.container-diagnostics.rollout.timeout.margin.seconds=60
stand.dev.container-diagnostics.logs.startup.window.seconds=600
stand.dev.container-diagnostics.logs.startup.max.lines=200

# Approved dedicated DEV stand. IFT/LT remain disabled below.
stand.dev.container-diagnostics.dedicated-stand=true
stand.dev.container-diagnostics.mutations.enabled=true
stand.dev.container-diagnostics.mutations.approval=dev/ci07963639-dev-terra000003-abtm-back/scheduler-service
stand.dev.container-diagnostics.mutations.yaml-fixture.enabled=true
stand.dev.container-diagnostics.mutations.restart.enabled=true
stand.dev.container-diagnostics.mutations.restart-without-unavailability.enabled=true
stand.dev.container-diagnostics.mutations.configmap.enabled=true
# Previously supplied DEV ConfigMap key. Test requires the current value to differ.
stand.dev.container-diagnostics.mutations.configmap.key=SCHEDULER_SERVICE_CLEAR_HUNG_TASKS_JOB_ENABLED
stand.dev.container-diagnostics.mutations.configmap.value=false

# No verified IFT/LT endpoints were supplied. No implicit fallback to DEV.
