# Static stand addresses and non-secret settings are committed in this file.
# Secret placeholders are resolved by Owner/ConfigurationService from secure.local.properties,
# secure.local.override.properties, environment variables, or JVM -D properties.

# Ссылка на документацию с описанием параметров по адресу:
# https://stash.delta.sbrf.ru/projects/SWATS/repos/platform-v-at-framework/browse/docs/services/kafkaService.md

# Default timeouts
kafka_consumer.all.session.timeout.ms=180000
kafka_consumer.all.request.timeout.ms=180000

# Default security protocol
kafka_consumer.all.security.protocol=PLAINTEXT

kafka_consumer.all.max.partition.fetch.bytes=2048576000
kafka_consumer.consumer.max.partition.fetch.bytes=2048576000
kafka_consumer.consumer1.max.partition.fetch.bytes=2048576000
kafka_consumer.all.fetch.max.bytes=204857600
kafka_consumer.all.max.poll.records=300000
kafka_consumer.all.fetch.max.wait.ms=10000
kafka_consumer.all.enable.auto.commit=false
# kafka_consumer.all.auto.offset.reset=earliest

kafka_consumer.all.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka_consumer.all.value.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka_consumer.all.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka_consumer.all.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Для конкретной очереди
kafka_consumer.all.bootstrap.servers=localhost:9092
kafka_consumer.all.group.id=1

kafka_consumer.consumer2.group.id=2

# Для конкретной очереди с SSL-шифрованием
kafka_consumer.my_ssl_kafka.security.protocol=SSL
kafka_consumer.my_ssl_kafka.ssl.keystore.location=MySslKeyStorePath
kafka_consumer.my_ssl_kafka.ssl.truststore.location=MySslTrustStorePath
kafka_consumer.my_ssl_kafka.ssl.keystore.password=${SECURE_KAFKA_CONSUMER_MY_SSL_KAFKA_SSL_KEYSTORE_PASSWORD}
kafka_consumer.my_ssl_kafka.ssl.truststore.password=${SECURE_KAFKA_CONSUMER_MY_SSL_KAFKA_SSL_TRUSTSTORE_PASSWORD}
kafka_consumer.my_ssl_kafka.ssl.key.password=${SECURE_KAFKA_CONSUMER_MY_SSL_KAFKA_SSL_KEY_PASSWORD}
kafka_consumer.my_ssl_kafka.ssl.endpoint.identification.algorithm=

# Для конкретной очереди с SSL-шифрованием
kafka_consumer.my_sasl_kafka.security.protocol=SASL_PLAINTEXT
kafka_consumer.my_sasl_kafka.sasl.kerberos.service.name=kafka
kafka_consumer.my_sasl_kafka.java.security.krb5.conf=pathToFile
kafka_consumer.my_sasl_kafka.sasl.jaas.config=${SECURE_KAFKA_CONSUMER_MY_SASL_KAFKA_SASL_JAAS_CONFIG}


# ========== IFT ==========
kafka_consumer.ift.bootstrap.servers=tsldq-mvp000243.cloud.delta.sbrf.ru:9093,tsldq-mvp000244.cloud.delta.sbrf.ru:9093,tsldq-mvp000245.cloud.delta.sbrf.ru:9093
kafka_consumer.ift.security.protocol=SSL
kafka_consumer.ift.truststore.type=JKS
kafka_consumer.ift.ssl.keystore.location=C:\\Work\\start\\kafka\\keystore-ood-new.jks
kafka_consumer.ift.ssl.truststore.location=C:\\Work\\start\\kafka\\truststore-ood-new.jks
kafka_consumer.ift.ssl.truststore.password=${SECURE_KAFKA_CONSUMER_IFT_SSL_TRUSTSTORE_PASSWORD}
kafka_consumer.ift.ssl.keystore.password=${SECURE_KAFKA_CONSUMER_IFT_SSL_KEYSTORE_PASSWORD}
kafka_consumer.ift.auto.offset.reset=earliest
kafka_consumer.ift.enable.auto.commit=false


