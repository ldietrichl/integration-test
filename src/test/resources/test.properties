# Static stand addresses and non-secret settings are committed in this file.
# Secret placeholders are resolved by Owner/ConfigurationService from secure.local.properties,
# secure.local.override.properties, environment variables, or JVM -D properties.

# Активное окружение REST-тестов: dev, ift, ift-dm, lt, local
env=dev

# Режим загрузки splitter config: rest или kafka.
splitter.config.load.mode=rest

# Kafka-настройки splitter regression для DEV.
# Значения сверены с логами splitter-service и Offset Explorer DEV:
# bootstrap servers задаются в kafka-consumers.properties/kafka-producers.properties.
splitter.config.kafka.env=splitter_dev
splitter.config.kafka.input.topic=splitting-config-created
splitter.config.kafka.status.topic=splitting-config-requested-and-received
splitter.config.kafka.monitoring.topic=omon_explab_splitter_log
splitter.config.kafka.status.required=false
splitter.config.kafka.timeout.seconds=45
splitter.config.kafka.unique.consumer.group.enabled=true
splitter.config.kafka.consumer.group.prefix=integration-test-splitter-config-load
splitter.config.kafka.consumer.warmup.seconds=0

splitter.kap.kafka.env=splitter_dev
splitter.kap.topic=explab-splitting-result
splitter.kap.monitoring.topic=omon_explab_splitter_log
splitter.kap.timeout.seconds=60
splitter.kap.monitoring.timeout.seconds=10

splitter.precalc.monitoring.kafka.env=splitter_dev
splitter.precalc.monitoring.topic=omon_explab_splitter_log
splitter.precalc.monitoring.timeout.seconds=45

splitter.config.load.monitoring.kafka.env=splitter_dev
splitter.config.load.monitoring.topic=omon_explab_splitter_log
splitter.config.load.monitoring.timeout.seconds=45

# Общий ingress ExpLab. Для логических сервисов без отдельного override
# используется rest.<env>.gateway.base-uri.
rest.dev.gateway.base-uri=https://ingress-v2.ci07963639-dev-terra000003-abtm-back.apps.dev-terra000003-ids.ocp.delta.sbrf.ru
rest.ift.gateway.base-uri=https://ingress-v2.ci07963639-eift-efs1-ds-abtm-back.apps.ift-efs1-ds.delta.sbrf.ru
rest.ift-dm.gateway.base-uri=https://ingress-v2.ci07963639-eift-efs1-dm-abtm-back.apps.ift-efs1-dm.delta.sbrf.ru
rest.lt.gateway.base-uri=http://ingress-v2.ci02047903-lt-explab-utility-http.apps.a6vws9j4.k8s.delta.sbrf.ru

# URI сервисов, отличающихся от общего ingress.
# Остальные логические сервисы (experiments, dictionaries, data-operator,
# messages, splitter) автоматически используют gateway выбранного env.
#
# Для окружений, где MAPPER и REACTIONS splitter опубликованы как разные
# сервисы/версии, задавайте отдельные overrides:
# rest.<env>.splitter-mapper.base-uri=https://...
# rest.<env>.splitter-reactions.base-uri=https://...
# Если задан только rest.<env>.splitter.base-uri, оба профиля используют его.
# Data-operator запускается отдельным suite и может иметь свой override:
# rest.<env>.data-operator.base-uri=https://...
rest.dev.configuration-service.base-uri=http://ingress-http.ci07963639-dev-terra000003-abtm-back.apps.dev-terra000003-ids.ocp.delta.sbrf.ru
rest.dev.message-audit.base-uri=http://ingress-http.ci07963639-dev-terra000003-abtm-back.apps.dev-terra000003-ids.ocp.delta.sbrf.ru

# На IFT/LT отдельный ingress для этих сервисов не задан: используется общий ingress.
rest.ift.configuration-service.base-uri=https://ingress-v2.ci07963639-eift-efs1-ds-abtm-back.apps.ift-efs1-ds.delta.sbrf.ru
rest.ift.message-audit.base-uri=https://ingress-v2.ci07963639-eift-efs1-ds-abtm-back.apps.ift-efs1-ds.delta.sbrf.ru
rest.ift-dm.configuration-service.base-uri=https://ingress-v2.ci07963639-eift-efs1-dm-abtm-back.apps.ift-efs1-dm.delta.sbrf.ru
rest.ift-dm.message-audit.base-uri=https://ingress-v2.ci07963639-eift-efs1-dm-abtm-back.apps.ift-efs1-dm.delta.sbrf.ru
rest.lt.configuration-service.base-uri=http://ingress-v2.ci02047903-lt-explab-utility-http.apps.a6vws9j4.k8s.delta.sbrf.ru
rest.lt.message-audit.base-uri=http://ingress-v2.ci02047903-lt-explab-utility-http.apps.a6vws9j4.k8s.delta.sbrf.ru

