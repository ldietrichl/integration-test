# Ссылка на документацию с описанием параметров по адресу:
# https://stash.delta.sbrf.ru/projects/SWATS/repos/platform-v-at-framework/browse/docs/services/kafkaService.md

# Default timeouts
kafka_producer.all.delivery.timeout.ms=180000
kafka_producer.all.request.timeout.ms=180000

# Default security protocol
kafka_producer.all.security.protocol=PLAINTEXT

kafka_producer.all.max.request.size=5000000
kafka_producer.all.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka_producer.all.value.serializer=org.apache.kafka.common.serialization.StringSerializer

kafka_producer.producer.bootstrap.servers=localhost:9092
kafka_producer.producer1.bootstrap.servers=localhost:9092
kafka_producer.producer2.bootstrap.servers=localhost:9092
kafka_producer.all.acks=1

# Для конкретной очереди с SSL-шифрованием
kafka_producer.my_ssl_kafka.security.protocol=SSL
kafka_producer.my_ssl_kafka.ssl.keystore.location=MySslKeyStorePath
kafka_producer.my_ssl_kafka.ssl.truststore.location=MySslTrustStorePath
kafka_producer.my_ssl_kafka.ssl.keystore.password=MySslKeyStorePassword
kafka_producer.my_ssl_kafka.ssl.truststore.password=MySslTrustStorePassword
kafka_producer.my_ssl_kafka.ssl.key.password=MySSlKeyPassword
kafka_producer.my_ssl_kafka.ssl.endpoint.identification.algorithm=

# Для конкретной очереди с SSL-шифрованием
kafka_producer.my_sasl_kafka.security.protocol=SASL_PLAINTEXT
kafka_producer.my_sasl_kafka.sasl.kerberos.service.name=kafka
kafka_producer.my_sasl_kafka.java.security.krb5.conf=pathToFile
kafka_producer.my_sasl_kafka.sasl.jaas.config=pathToConfig