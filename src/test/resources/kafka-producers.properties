kafka_producer.splitter_dev.bootstrap.servers=tsleq-mvp000412.esrt.sber.ru:9092,tsleq-mvp000413.esrt.sber.ru:9092
kafka_producer.splitter_dev.security.protocol=PLAINTEXT
kafka_producer.splitter_dev.acks=1
kafka_producer.splitter_dev.request.timeout.ms=240000
kafka_producer.splitter_dev.delivery.timeout.ms=300000

