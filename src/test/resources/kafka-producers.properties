# Static stand addresses and non-secret settings are committed in this file.
# Secret placeholders are resolved by Owner/ConfigurationService from secure.local.properties,
# secure.local.override.properties, environment variables, or JVM -D properties.
#
# Kafka is shared by splitter and other suites. Do not repoint common profiles
# such as dev only for splitter runs; use splitter_* aliases.

# Platform V AT Framework KafkaService docs:
# https://stash.delta.sbrf.ru/projects/SWATS/repos/platform-v-at-framework/browse/docs/services/kafkaService.md

# Default timeouts
# Kafka 4.0 validates delivery.timeout.ms >= request.timeout.ms + linger.ms.
# Corporate splitter runs may resolve request.timeout.ms as 240000, so keep delivery above it.
kafka_producer.all.delivery.timeout.ms=300000
kafka_producer.all.request.timeout.ms=180000

# Default security protocol
kafka_producer.all.security.protocol=PLAINTEXT

kafka_producer.all.max.request.size=5000000
kafka_producer.all.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka_producer.all.value.serializer=org.apache.kafka.common.serialization.StringSerializer

kafka_producer.producer.bootstrap.servers=localhost:9092
kafka_producer.producer1.bootstrap.servers=localhost:9092
kafka_producer.producer2.bootstrap.servers=localhost:9092
kafka_producer.all.acks=1

# Sample SSL profile kept for Kafka suites that use it explicitly.
kafka_producer.my_ssl_kafka.security.protocol=SSL
kafka_producer.my_ssl_kafka.ssl.keystore.location=MySslKeyStorePath
kafka_producer.my_ssl_kafka.ssl.truststore.location=MySslTrustStorePath
kafka_producer.my_ssl_kafka.ssl.keystore.password=${SECURE_KAFKA_PRODUCER_MY_SSL_KAFKA_SSL_KEYSTORE_PASSWORD}
kafka_producer.my_ssl_kafka.ssl.truststore.password=${SECURE_KAFKA_PRODUCER_MY_SSL_KAFKA_SSL_TRUSTSTORE_PASSWORD}
kafka_producer.my_ssl_kafka.ssl.key.password=${SECURE_KAFKA_PRODUCER_MY_SSL_KAFKA_SSL_KEY_PASSWORD}
kafka_producer.my_ssl_kafka.ssl.endpoint.identification.algorithm=

# Sample SASL profile kept for Kafka suites that use it explicitly.
kafka_producer.my_sasl_kafka.security.protocol=SASL_PLAINTEXT
kafka_producer.my_sasl_kafka.sasl.kerberos.service.name=kafka
kafka_producer.my_sasl_kafka.java.security.krb5.conf=pathToFile
kafka_producer.my_sasl_kafka.sasl.jaas.config=${SECURE_KAFKA_PRODUCER_MY_SASL_KAFKA_SASL_JAAS_CONFIG}

# ========== DEV / ExpLab splitter DEV ==========
kafka_producer.dev.bootstrap.servers=tsleq-mvp000412.esrt.sber.ru:9092,tsleq-mvp000413.esrt.sber.ru:9092
kafka_producer.dev.security.protocol=PLAINTEXT
kafka_producer.dev.acks=1

