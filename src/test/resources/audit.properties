# Настройки сессии для просмотра событий АС Единый Аудит
# URL сервиса
unified.audit.url=
# Логин сервиса
unified.audit.login=
# Пароль сервиса
unified.audit.password=

# Наборы параметров для источника Coordinator
# Набор параметров с именем 'testvalue'
# Топик Kafka (возможное значение: целое число более 0)
unified.audit.coordinator.testvalue.kafka.topic=1234
# Максимальное количество записей в ответе (возможное значение: целое число более 0)
unified.audit.coordinator.testvalue.max.rows.in.result=1
# Максимальное количество записей для поиска событий (возможное значение: целое число более 0)
unified.audit.coordinator.testvalue.max.rows.to.scan=1000
# Сортировка записей в ответе (возможные значения: latest - по возрастанию, earliest - по убыванию)
unified.audit.coordinator.testvalue.filter.offset.sort=latest